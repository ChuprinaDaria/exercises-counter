<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Counter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', monospace; background: #0f0f1a; color: #eee; }

        .layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            grid-template-rows: auto 1fr;
            gap: 1rem;
            padding: 1rem;
            height: 100vh;
        }

        header {
            grid-column: 1 / -1;
            display: flex; align-items: center; gap: 1rem;
        }
        header h1 { font-size: 1.4rem; color: #e94560; }
        #status {
            font-size: 0.8rem; padding: 4px 12px;
            border-radius: 12px; background: #1a1a2e;
        }
        .connected { color: #4ecca3; border: 1px solid #4ecca3; }
        .disconnected { color: #e94560; border: 1px solid #e94560; }

        /* Stick figure panel */
        .stick-panel {
            background: #1a1a2e; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center;
            padding: 1rem; position: relative;
        }
        .stick-panel h2 { font-size: 0.9rem; color: #888; margin-bottom: 0.5rem; }
        #stick-canvas {
            background: #0f0f23; border-radius: 8px;
            width: 100%; aspect-ratio: 3/4;
        }
        #frame-info {
            font-size: 0.75rem; color: #555; margin-top: 0.5rem;
        }

        /* Right panel: dashboard */
        .dashboard {
            display: flex; flex-direction: column; gap: 1rem;
            overflow-y: auto;
        }

        /* Pattern cards */
        .cards { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .card {
            background: #1a1a2e; border-radius: 12px;
            padding: 1.2rem 1.5rem; min-width: 180px;
            border: 1px solid #16213e;
        }
        .card .reps { font-size: 2.8rem; font-weight: 700; color: #f0a500; }
        .card .name { font-size: 0.9rem; color: #eee; margin-bottom: 0.3rem; }
        .card .body-parts { font-size: 0.7rem; color: #888; margin-top: 0.3rem; }

        /* Summary box */
        .summary-box {
            background: #1a1a2e; border-radius: 12px; padding: 1rem;
            border: 1px solid #16213e;
        }
        .summary-box h3 {
            font-size: 0.85rem; color: #888; margin-bottom: 0.5rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .summary-row {
            display: flex; justify-content: space-between;
            padding: 3px 0; font-size: 0.8rem;
        }
        .summary-row .part-name { color: #aaa; }
        .summary-row .part-count { color: #4ecca3; font-weight: 600; }

        /* Routine banner */
        .routine-banner {
            background: #1a1a2e; border-radius: 12px; padding: 1rem 1.5rem;
            border: 1px solid #3a86ff; display: none;
        }
        .routine-banner .routine-label {
            font-size: 0.75rem; color: #3a86ff; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 0.3rem;
        }
        .routine-banner .routine-seq {
            font-size: 1.1rem; color: #eee; font-weight: 600;
        }
        .routine-banner .routine-sets {
            font-size: 0.85rem; color: #3a86ff; margin-left: 1rem;
        }

        /* Timeline chart */
        .chart-box {
            background: #1a1a2e; border-radius: 12px; padding: 1rem;
            border: 1px solid #16213e;
        }
        .chart-box h3 { font-size: 0.85rem; color: #888; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        #timeline-canvas { width: 100%; height: 180px; }

        /* Event log */
        .log-box {
            background: #1a1a2e; border-radius: 12px; padding: 1rem;
            border: 1px solid #16213e; flex: 1; min-height: 150px;
            overflow-y: auto;
        }
        .log-box h3 { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
        #log p {
            padding: 4px 8px; font-size: 0.8rem; font-family: monospace;
            border-radius: 4px; margin-bottom: 2px;
        }
        #log p:nth-child(odd) { background: #16213e; }

        @keyframes fadeout {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <header>
            <h1>Exercise Counter</h1>
            <span id="status" class="disconnected">disconnected</span>
        </header>

        <div class="stick-panel">
            <h2>Pose</h2>
            <canvas id="stick-canvas"></canvas>
            <div id="frame-info">waiting for data...</div>
        </div>

        <div class="dashboard">
            <div id="summary-cards" class="cards">
                <div class="card"><div class="name">All Reps</div><div class="reps" id="sum-reps">0</div></div>
                <div class="card"><div class="name">Duration</div><div class="reps" id="sum-duration" style="font-size:1.6rem">0:00</div></div>
            </div>
            <div id="exercise-cards" class="cards"></div>

            <div id="routine-banner" class="routine-banner">
                <div class="routine-label">Routine</div>
                <span class="routine-seq" id="routine-seq"></span>
                <span class="routine-sets" id="routine-sets"></span>
            </div>

            <div id="body-summary" class="summary-box" style="display:none">
                <h3>Body parts</h3>
                <div id="body-parts-list"></div>
            </div>

            <div class="chart-box">
                <h3>Timeline</h3>
                <canvas id="timeline-canvas"></canvas>
            </div>

            <div class="log-box">
                <h3>Event Log</h3>
                <div id="log"></div>
            </div>
        </div>
    </div>

    <script>
    // --- Stick figure ---
    const CONNECTIONS = [
        [11,12],
        [11,13],[13,15],
        [12,14],[14,16],
        [11,23],[12,24],[23,24],
        [23,25],[25,27],
        [24,26],[26,28],
    ];
    const JOINT_COLORS = {
        arm: [11,13,15,12,14,16], leg: [23,25,27,24,26,28],
        torso: [11,12,23,24]
    };
    const VISIBLE_JOINTS = new Set([11,12,13,14,15,16,23,24,25,26,27,28]);

    // Joint ID → body part name (used for stick figure coloring only;
    // dashboard gets body_parts from API via body_parts.py)
    const JOINT_TO_PART = {};
    [11,12].forEach(j => JOINT_TO_PART[j] = 'Shoulders');
    [13,14,15,16].forEach(j => JOINT_TO_PART[j] = 'Arms');
    [23,24].forEach(j => JOINT_TO_PART[j] = 'Hips');
    [25,26,27,28].forEach(j => JOINT_TO_PART[j] = 'Legs');

    const canvas = document.getElementById('stick-canvas');
    const ctx = canvas.getContext('2d');
    const frameInfo = document.getElementById('frame-info');

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawStick(landmarks) {
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;
        ctx.clearRect(0, 0, w, h);

        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for (const [a, b] of CONNECTIONS) {
            const la = landmarks[a], lb = landmarks[b];
            if (la.v < 0.3 || lb.v < 0.3) continue;
            const isArm = JOINT_COLORS.arm.includes(a) || JOINT_COLORS.arm.includes(b);
            const isLeg = JOINT_COLORS.leg.includes(a) || JOINT_COLORS.leg.includes(b);
            ctx.strokeStyle = isArm ? '#e94560' : isLeg ? '#4ecca3' : '#5eadff';
            ctx.beginPath();
            ctx.moveTo(la.x * w, la.y * h);
            ctx.lineTo(lb.x * w, lb.y * h);
            ctx.stroke();
        }

        for (let i = 0; i < landmarks.length; i++) {
            if (!VISIBLE_JOINTS.has(i)) continue;
            const lm = landmarks[i];
            if (lm.v < 0.3) continue;
            const isArm = JOINT_COLORS.arm.includes(i);
            const isLeg = JOINT_COLORS.leg.includes(i);
            ctx.fillStyle = isArm ? '#e94560' : isLeg ? '#4ecca3' : '#5eadff';
            ctx.beginPath();
            ctx.arc(lm.x * w, lm.y * h, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0f0f23';
            ctx.beginPath();
            ctx.arc(lm.x * w, lm.y * h, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        const ls = landmarks[11], rs = landmarks[12];
        if (ls.v > 0.3 && rs.v > 0.3) {
            const hx = (ls.x + rs.x) / 2;
            const hy = Math.min(ls.y, rs.y) - 0.07;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(hx * w, hy * h, 18, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    // --- Dashboard state ---
    const state = {
        events: [],
        patternInfo: {},  // {id: {dominant_joints: [...], body_parts: [...]}}
        knownPatterns: new Set(),
        routine: null,    // {routine_id, sequence, sets}
    };
    const statusEl = document.getElementById('status');
    const logDiv = document.getElementById('log');

    function updateDashboard() {
        const events = state.events;
        const patternIds = [...new Set(events.map(e => e.pattern_id))].sort((a, b) => a - b);

        // Per-exercise cards
        const container = document.getElementById('exercise-cards');
        container.innerHTML = '';
        const bodyPartReps = {};  // {partName: totalReps}

        for (const pid of patternIds) {
            const maxCount = Math.max(0, ...events.filter(e => e.pattern_id === pid).map(e => e.count));
            const info = state.patternInfo[pid];
            const name = info ? (info.name || `#${pid}`) : `#${pid}`;
            const parts = info ? (info.body_parts || []) : [];

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="name">${name}</div>`
                + `<div class="reps">${maxCount}</div>`
                + (parts.length ? `<div class="body-parts">${parts.join(', ')}</div>` : '');
            container.appendChild(card);

            // Accumulate body part reps
            for (const part of parts) {
                bodyPartReps[part] = (bodyPartReps[part] || 0) + maxCount;
            }
        }

        // Body parts summary
        const summaryBox = document.getElementById('body-summary');
        const partsList = document.getElementById('body-parts-list');
        const partNames = Object.keys(bodyPartReps);
        if (partNames.length > 0) {
            summaryBox.style.display = '';
            partsList.innerHTML = '';
            for (const part of partNames.sort()) {
                const row = document.createElement('div');
                row.className = 'summary-row';
                row.innerHTML = `<span class="part-name">${part}</span><span class="part-count">${bodyPartReps[part]} repeats</span>`;
                partsList.appendChild(row);
            }
        }

        // Routine banner
        const banner = document.getElementById('routine-banner');
        if (state.routine) {
            banner.style.display = '';
            document.getElementById('routine-seq').textContent =
                state.routine.sequence.map(id => {
                    const info = state.patternInfo[id];
                    return info ? info.name : `#${id}`;
                }).join(' → ');
            document.getElementById('routine-sets').textContent =
                `${state.routine.sets} sets`;
        }

        // Summary
        const totalReps = patternIds.reduce((sum, pid) =>
            sum + Math.max(0, ...events.filter(e => e.pattern_id === pid).map(e => e.count)), 0);
        document.getElementById('sum-reps').textContent = totalReps;
        if (events.length > 0) {
            const dur = Math.round(events[events.length - 1].timestamp);
            document.getElementById('sum-duration').textContent =
                `${Math.floor(dur / 60)}:${String(dur % 60).padStart(2, '0')}`;
        }

        drawTimeline(events);
    }

    function fetchPatternInfo() {
        fetch('/api/stats').then(r => r.json()).then(data => {
            for (const p of data.patterns) {
                state.patternInfo[p.id] = {
                    name: p.name,
                    dominant_joints: p.dominant_joints,
                    body_parts: p.body_parts || [],
                };
            }
            if (data.routine) state.routine = data.routine;
            updateDashboard();
        }).catch(() => {});
    }

    // --- Timeline chart ---
    function drawTimeline(events) {
        const tc = document.getElementById('timeline-canvas');
        const tctx = tc.getContext('2d');
        const rect = tc.getBoundingClientRect();
        tc.width = rect.width * devicePixelRatio;
        tc.height = rect.height * devicePixelRatio;
        tctx.scale(devicePixelRatio, devicePixelRatio);
        const w = rect.width, h = rect.height;

        tctx.clearRect(0, 0, w, h);
        if (events.length < 2) {
            tctx.fillStyle = '#333';
            tctx.font = '14px monospace';
            tctx.textAlign = 'center';
            tctx.fillText('waiting for data...', w/2, h/2);
            return;
        }

        const timestamps = events.map(e => e.timestamp);
        const counts = events.map(e => e.count);
        const minT = Math.min(...timestamps);
        const maxT = Math.max(...timestamps);
        const maxC = Math.max(...counts);
        const pad = { l: 40, r: 20, t: 10, b: 30 };
        const cw = w - pad.l - pad.r;
        const ch = h - pad.t - pad.b;

        tctx.strokeStyle = '#1a1a2e';
        tctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            const y = pad.t + (ch / 4) * i;
            tctx.beginPath(); tctx.moveTo(pad.l, y); tctx.lineTo(w - pad.r, y); tctx.stroke();
        }

        tctx.fillStyle = '#555';
        tctx.font = '11px monospace';
        tctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
            const val = Math.round(maxC - (maxC / 4) * i);
            tctx.fillText(val, pad.l - 5, pad.t + (ch / 4) * i + 4);
        }
        tctx.textAlign = 'center';
        for (let i = 0; i <= 5; i++) {
            const t = minT + ((maxT - minT) / 5) * i;
            const x = pad.l + (cw / 5) * i;
            tctx.fillText(Math.round(t) + 's', x, h - 5);
        }

        tctx.strokeStyle = '#e94560';
        tctx.lineWidth = 2;
        tctx.beginPath();
        for (let i = 0; i < events.length; i++) {
            const x = pad.l + ((timestamps[i] - minT) / (maxT - minT || 1)) * cw;
            const y = pad.t + ch - (counts[i] / maxC) * ch;
            if (i === 0) tctx.moveTo(x, y); else tctx.lineTo(x, y);
        }
        tctx.stroke();

        tctx.lineTo(pad.l + cw, pad.t + ch);
        tctx.lineTo(pad.l, pad.t + ch);
        tctx.closePath();
        const grad = tctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
        grad.addColorStop(0, 'rgba(233,69,96,0.3)');
        grad.addColorStop(1, 'rgba(233,69,96,0)');
        tctx.fillStyle = grad;
        tctx.fill();

        for (let i = 0; i < events.length; i++) {
            const x = pad.l + ((timestamps[i] - minT) / (maxT - minT || 1)) * cw;
            const y = pad.t + ch - (counts[i] / maxC) * ch;
            tctx.fillStyle = '#e94560';
            tctx.beginPath();
            tctx.arc(x, y, 4, 0, Math.PI * 2);
            tctx.fill();
            tctx.fillStyle = '#0f0f1a';
            tctx.beginPath();
            tctx.arc(x, y, 2, 0, Math.PI * 2);
            tctx.fill();
        }
    }

    function addLog(msg, type) {
        const p = document.createElement('p');
        p.textContent = msg;
        if (type === 'new') {
            p.style.color = '#4ecca3';
            p.style.fontWeight = 'bold';
            p.style.borderLeft = '3px solid #4ecca3';
            p.style.paddingLeft = '8px';
        } else if (type === 'started') {
            p.style.color = '#f0a500';
            p.style.fontWeight = 'bold';
            p.style.borderLeft = '3px solid #f0a500';
            p.style.paddingLeft = '8px';
        } else if (type === 'routine') {
            p.style.color = '#3a86ff';
            p.style.fontWeight = 'bold';
            p.style.borderLeft = '3px solid #3a86ff';
            p.style.paddingLeft = '8px';
        }
        logDiv.prepend(p);
        if (logDiv.children.length > 100) logDiv.lastChild.remove();
    }

    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.textContent = msg;
        toast.style.cssText = `position:fixed;top:1rem;right:1rem;background:${color || '#f0a500'};color:#0f0f1a;padding:12px 24px;border-radius:8px;font-weight:700;font-size:1.1rem;z-index:999;animation:fadeout 3s forwards`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // --- WebSocket: events ---
    function connectEvents() {
        const ws = new WebSocket(`ws://${location.host}/ws/events`);
        ws.onopen = () => {
            statusEl.textContent = 'live';
            statusEl.className = 'connected';
        };
        ws.onclose = () => {
            statusEl.textContent = 'disconnected';
            statusEl.className = 'disconnected';
            setTimeout(connectEvents, 2000);
        };
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);

            if (data.type === 'routine') {
                state.routine = data;
                const seqNames = data.sequence.map(id => {
                    const info = state.patternInfo[id];
                    return info ? info.name : `#${id}`;
                }).join(' → ');
                addLog(`Routine detected: ${seqNames} — ${data.sets} sets`, 'routine');
                showToast(`Routine: ${seqNames} — ${data.sets} sets`, '#3a86ff');
                updateDashboard();
                return;
            }

            // type === 'exercise' (or legacy without type)
            state.events.push(data);

            if (data.count === 0) {
                const isNew = !state.knownPatterns.has(data.pattern_id);
                state.knownPatterns.add(data.pattern_id);
                if (isNew) {
                    addLog(`[${data.timestamp}s] New exercise detected`, 'new');
                    showToast(`New exercise detected`, '#4ecca3');
                    fetchPatternInfo();
                } else {
                    const info = state.patternInfo[data.pattern_id];
                    const name = info ? info.name : `#${data.pattern_id}`;
                    addLog(`[${data.timestamp}s] ${name} resumed`, 'started');
                    showToast(`${name} resumed`);
                }
            } else {
                const info = state.patternInfo[data.pattern_id];
                const name = info ? info.name : `#${data.pattern_id}`;
                addLog(`[${data.timestamp}s] ${name} — rep ${data.count}`);
            }
            updateDashboard();
        };
    }

    // --- WebSocket: landmarks (stick figure) ---
    function connectLandmarks() {
        const ws = new WebSocket(`ws://${location.host}/ws/landmarks`);
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            drawStick(data.landmarks);
            frameInfo.textContent = `frame ${data.frame}`;
        };
        ws.onclose = () => setTimeout(connectLandmarks, 2000);
    }

    // --- Init ---
    connectEvents();
    connectLandmarks();

    fetch('/api/stats').then(r => r.json()).then(data => {
        for (const p of data.patterns) {
            state.patternInfo[p.id] = {
                name: p.name,
                dominant_joints: p.dominant_joints,
                body_parts: p.body_parts || [],
            };
            state.knownPatterns.add(p.id);
        }
        state.events = data.events;
        if (data.routine) state.routine = data.routine;
        updateDashboard();
    }).catch(() => {});

    window.addEventListener('resize', () => drawTimeline(state.events));
    </script>
</body>
</html>
